# Project information
site_name: Flask Todo App Documentation
site_description: Documentation for the Flask Todo Application
site_author: Your Name

# Repository
repo_name: agusvillarreal/flask-todo-app
repo_url: https://github.com/agusvillarreal/flask-todo-app
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Extensions
markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

# Navigation
nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Configuration: configuration.md
  - User Guide:
    - Authentication: authentication.md
    - Task Management: tasks.md
  - API Reference:
    - Authentication API: api/auth.md
    - Tasks API: api/tasks.md
  - Development:
    - Architecture: development/architecture.md
    - Contributing: development/contributing.md
  - Troubleshooting: troubleshooting.md